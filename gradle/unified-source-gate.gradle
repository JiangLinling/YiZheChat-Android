import groovy.json.JsonSlurper
import java.security.MessageDigest

// Every cumulative APK, including both internal variants, must retain its reviewed source baseline. This is a
// local integration gate, independent of server authority/signature validation.
def manifestFile = rootProject.file('unified-source-manifest.json')
def verifyUnifiedSourceBaseline = tasks.register('verifyUnifiedSourceBaseline') {
    group = 'verification'
    description = 'Rejects omitted or replaced cumulative Android source inputs before Next packaging.'
    inputs.file(manifestFile)
    doLast {
        if (!manifestFile.isFile()) {
            throw new GradleException('UNIFIED_SOURCE_MANIFEST_MISSING: run tools/next/freeze_unified_source.py after reviewing the cumulative source.')
        }
        def manifest = new JsonSlurper().parse(manifestFile)
        if (manifest.schema_version != 1 || !manifest.sources || manifest.sources.size() < 10000) {
            throw new GradleException('UNIFIED_SOURCE_MANIFEST_INCOMPLETE')
        }
        def problems = []
        // A new service or source-set file must also be reviewed and frozen.
        // Checking only old entries would allow unfrozen additions into one variant.
        if (manifest.source_selection) {
            def selection = manifest.source_selection
            def selected = rootProject.fileTree(rootProject.projectDir) {
                include '*'
                selection.roots.each { include it + '/**' }
                exclude '**/build/**', '**/node_modules/**', '**/out/**', '**/__pycache__/**', '**/.*/**'
            }.files.findAll { source ->
                def relative = rootProject.relativePath(source).replace('\\', '/')
                def name = source.name
                def dot = name.lastIndexOf('.')
                def extension = dot < 0 ? '' : name.substring(dot)
                !(relative in ['local.properties', 'gradle.properties', 'unified-source-manifest.json']) &&
                    (extension in selection.extensions || relative.contains('/src/') ||
                        relative.startsWith('tools/') || name == 'gradlew' || extension == '.pro')
            }.collect { rootProject.relativePath(it).replace('\\', '/') }.toSet()
            (selected - manifest.sources.keySet()).sort().each { problems.add(it + ': UNREVIEWED_SOURCE') }
        }
        manifest.sources.each { relative, expected ->
            def source = rootProject.file(relative).canonicalFile
            if (!source.toPath().startsWith(rootProject.projectDir.canonicalFile.toPath())) {
                problems.add(relative + ': OUTSIDE_SOURCE_ROOT')
            } else if (!source.isFile()) {
                problems.add(relative + ': MISSING')
            } else {
                def digest = MessageDigest.getInstance('SHA-256')
                source.withInputStream { input ->
                    byte[] buffer = new byte[65536]
                    int length
                    while ((length = input.read(buffer)) != -1) digest.update(buffer, 0, length)
                }
                if (digest.digest().encodeHex().toString() != expected) problems.add(relative + ': SOURCE_DRIFT')
            }
        }
        if (problems) throw new GradleException('UNIFIED_SOURCE_BASELINE_REJECTED\n' + problems.take(20).join('\n'))
        logger.lifecycle('UNIFIED_SOURCE_BASELINE_PASS: ' + manifest.sources.size() + ' reviewed inputs; revision=' + manifest.revision)
    }
}
allprojects {
    tasks.configureEach {
        if (name in ['preNextDebugBuild', 'preNextReleaseBuild', 'preNextInternalDebugBuild', 'preNextInternalReleaseBuild']) {
            dependsOn(verifyUnifiedSourceBaseline)
        }
    }
}

<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:16px system-ui;background:#fff;color:#191919}#map{height:65%;width:100%}.pin{width:25px;height:25px;border-radius:50% 50% 50% 0;background:#07c160;border:4px solid white;transform:translate(-50%,-100%) rotate(-45deg);box-shadow:0 1px 5px #888}#panel{height:35%;display:flex;flex-direction:column}#search{margin:12px 14px;padding:9px 12px;border:0;background:#ededed;border-radius:8px;text-align:center;font-size:16px;outline:none}#places{overflow:auto;flex:1}.place{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #ededed;min-height:72px;cursor:pointer}.place strong{font-weight:400;display:block;font-size:17px}.place small{display:block;color:#999;margin-top:6px;font-size:13px}.tick{color:#07c160;font-size:25px;margin-left:auto}.place.selected{background:#fff}#recenter{position:absolute;left:14px;top:calc(65% - 65px);height:42px;width:42px;background:white;border:0;border-radius:8px;box-shadow:0 1px 4px #bbb;font-size:25px;color:#148fda}#status{padding:14px;color:#777;font-size:14px}#retry{border:0;background:white;color:#07c160;padding:12px}#credit{position:absolute;right:10px;top:calc(65% - 25px);color:#555;font-size:11px;background:#fffc}
</style></head><body><div id="map"></div><button id="recenter" aria-label="回到我的位置">⊙</button><span id="credit">高德地图</span><section id="panel"><input id="search" aria-label="搜索地点" placeholder="⌕ 搜索地点" maxlength="120"><div id="places"><div id="status">地图加载中…</div></div></section><script>
'use strict';
let map,searcher,geocoder,userPoint,selected,rows=[],generation=0,timer,ready=false,hasIntent=false,gpsInitialized=false,suppressMoveEnd=false,lastConfig;
const places=document.getElementById('places');
function report(){if(window.YizheLocation && selected && hasIntent)YizheLocation.selected(JSON.stringify({lat:selected.lat,lon:selected.lon,name:selected.name,address:selected.address}));}
function render(){places.replaceChildren();rows.forEach((p,i)=>{const row=document.createElement('div');row.className='place';const text=document.createElement('div');const name=document.createElement('strong');name.textContent=p.name;const address=document.createElement('small');address.textContent=p.address||'';text.append(name,address);row.append(text);if(selected===p){const tick=document.createElement('span');tick.className='tick';tick.textContent='✓';row.append(tick);}row.onclick=()=>{hasIntent=true;selected=p;render();report();suppressMoveEnd=true;map.setCenter([p.lon,p.lat],true);};places.append(row);});}
function pointFromPoi(p){return {lat:p.location.getLat(),lon:p.location.getLng(),name:p.name||'位置',address:typeof p.address==='string'?p.address:''};}
function showError(message){places.replaceChildren();const t=document.createElement('div');t.id='status';t.textContent=message;const retry=document.createElement('button');retry.id='retry';retry.textContent='重试';retry.onclick=()=>ready?refresh():startMap(lastConfig);places.append(t,retry);}
function refresh(){if(!ready)return;const token=++generation,center=map.getCenter(),keyword=document.getElementById('search').value.trim();
  selected=null;YizheLocation.clearSelection();
  if(keyword){hasIntent=true;searcher.search(keyword,(status,result)=>{if(token!==generation)return;if(status==='complete'&&result.poiList&&result.poiList.pois.length){rows=result.poiList.pois.filter(p=>p.location).map(pointFromPoi);selected=rows[0];render();report();suppressMoveEnd=true;map.setCenter([selected.lon,selected.lat],true);}else showError('未找到相关地点，请换个关键词');});return;}
  geocoder.getAddress(center,(status,result)=>{if(token!==generation)return;const address=status==='complete'&&result.regeocode?result.regeocode.formattedAddress:'';const current={lat:center.lat,lon:center.lng,name:address||'地图选定的位置',address:''};
    searcher.searchNearBy('',center,1500,(state,data)=>{if(token!==generation)return;rows=[current];if(state==='complete'&&data.poiList)rows.push(...data.poiList.pois.filter(p=>p.location).map(pointFromPoi));selected=current;render();report();});
  });
}
window.setUserLocation=function(lon,lat){userPoint=[lon,lat];if(ready&&!gpsInitialized&&!hasIntent){gpsInitialized=true;hasIntent=true;map.setCenter(userPoint);refresh();}};
window.startMap=function(config){if(!config)return;lastConfig=config;window._AMapSecurityConfig={serviceHost:config.serviceHost};const script=document.createElement('script');script.src='https://webapi.amap.com/maps?v=2.0&key='+encodeURIComponent(config.jsKey)+'&plugin=AMap.PlaceSearch,AMap.Geocoder,AMap.Scale';script.onerror=()=>{script.remove();showError('地图加载失败，请检查网络后重试');};script.onload=()=>{map=new AMap.Map('map',{zoom:16,center:userPoint||[116.397428,39.90923],viewMode:'2D'});map.addControl(new AMap.Scale());searcher=new AMap.PlaceSearch({pageSize:20,extensions:'base'});geocoder=new AMap.Geocoder({extensions:'base'});const pin=document.createElement('div');pin.className='pin';const marker=new AMap.Marker({content:pin,position:map.getCenter(),anchor:'bottom-center'});map.add(marker);map.on('moveend',()=>{marker.setPosition(map.getCenter());if(suppressMoveEnd){suppressMoveEnd=false;return;}clearTimeout(timer);timer=setTimeout(refresh,250);});map.on('dragstart',()=>{hasIntent=true;suppressMoveEnd=false;++generation;selected=null;YizheLocation.clearSelection();});map.on('complete',()=>{ready=true;if(userPoint){gpsInitialized=true;hasIntent=true;map.setCenter(userPoint);}refresh();});};document.head.append(script);};
document.getElementById('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(refresh,350);};document.getElementById('recenter').onclick=()=>{if(userPoint&&map){document.getElementById('search').value='';hasIntent=true;selected=null;map.setCenter(userPoint);refresh();}else YizheLocation.requestLocation();};
</script></body></html>
